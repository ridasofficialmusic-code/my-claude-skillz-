<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Waters Daily</title>
<style>
  @font-face { font-family: 'Cormorant'; font-style: normal; font-weight: 300 700; src: url('fonts/Cormorant-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant'; font-style: italic; font-weight: 300 700; src: url('fonts/Cormorant-italic.woff2') format('woff2'); }
  :root { --cream: #FFF8EC; --gold: #FFD27A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }

  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #1a1428; flex: none; }
  #bg { position: absolute; inset: 0; width: 1080px; height: 1920px; transform-origin: 50% 70%; }
  #shade { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 32% at 50% 45%, rgba(30,12,8,.32), transparent 70%); }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(10,4,2,.6) 100%); }
  #grain {
    position: absolute; inset: -50%; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  #text { position: absolute; inset: 0; color: var(--cream); text-align: center; }
  .line { position: absolute; left: 0; right: 0; white-space: nowrap; }
  .shadow { text-shadow: 0 2px 28px rgba(40,14,4,.6), 0 0 2px rgba(40,14,4,.35); }
  .hook { font: italic 500 76px/1.2 'Cormorant', serif; }
  .tag { font: 600 24px 'Inter', sans-serif; letter-spacing: 9px; opacity: .7; }
  .ref { font: 600 34px 'Inter', sans-serif; letter-spacing: 8px; text-transform: uppercase; }
  .verse { font: 600 88px/1 'Cormorant', serif; }
  .w { display: inline-block; will-change: transform, opacity, filter; }
  .w.em { font-style: italic; font-weight: 500; }
  .w.key { font-style: italic; font-weight: 600; }
  .cta { font: 500 36px 'Inter', sans-serif; letter-spacing: 1px; }

  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.15); cursor: pointer; }
  #ui > div { height: 100%; width: 0; background: var(--gold); }
  .render #ui { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="shade"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="text"></div>
</div>
<div id="ui"><div></div></div>

<script src="verses.js"></script>
<script>
const W = 1080, H = 1920;
const q = new URLSearchParams(location.search);
const RENDER = q.has('render');
if (RENDER) document.documentElement.classList.add('render');
const V = VERSES.find(v => v.id === q.get('v')) || VERSES[0];

// ---------- helpers (same conventions as kinetic-money) ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
};
const P = (t, s, d, e = E.outCubic) => e(clamp((t - s) / d));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')})`; };

// ---------- timeline ----------
const WORD_GAP = .27, WORD_IN = .8;
const T = { hookIn: .25, hookOut: 1.55, tag: 1.7, ref: 1.85, verse: 2.3 };
const words = V.lines.flatMap((l, li) => l.split(' ').map(w => ({ w, li })));
T.verseEnd = T.verse + (words.length - 1) * WORD_GAP + WORD_IN;
T.cta = T.verseEnd + 2.2;
T.out = T.cta + 2.4;
const DURATION = +(T.out + .7).toFixed(2);
const TAU = Math.PI * 2;
// background motion is periodic over DURATION, so the last frame flows into the first
const cyc = (t, k = 1, ph = 0) => Math.sin(TAU * k * t / DURATION + ph);
const warmth = t => .5 - .5 * Math.cos(TAU * t / DURATION);

// ---------- text ----------
const textEl = document.getElementById('text');
function line(cls, html, y) {
  const el = document.createElement('div');
  el.className = 'line shadow ' + cls; el.innerHTML = html; el.style.top = y + 'px';
  textEl.appendChild(el); return el;
}
let hookEl, tagEl, refEl, ctaEl, wordEls = [];
function buildText() {
  hookEl = line('hook', V.hook, H * .43);
  tagEl = line('tag', `STILL WATERS DAILY · DAY ${V.day}`, H * .245);
  refEl = line('ref', `${V.ref} · ${V.translation}`, H * .285);
  const lineH = 112, top = H * .45 - (V.lines.length * lineH) / 2 + 30;
  const rows = V.lines.map((_, i) => line('verse', '', top + i * lineH));
  // shrink the verse size if any line is too wide for the safe zone
  let size = 88;
  const probe = document.createElement('span'); probe.className = 'verse'; probe.style.position = 'absolute'; probe.style.visibility = 'hidden';
  textEl.appendChild(probe);
  V.lines.forEach(l => { probe.textContent = l; size = Math.min(size, 88 * (W * .84) / probe.offsetWidth); });
  probe.remove();
  rows.forEach(r => { r.textContent = ''; r.style.fontSize = size + 'px'; });
  words.forEach(({ w, li }, i) => {
    const s = document.createElement('span');
    const key = V.keyword.includes(w.replace(/[^\w']/g, '')) || V.keyword.includes(w);
    const em = !key && V.emphasis.includes(w) && li === V.lines.length - 1;
    s.className = 'w' + (key ? ' key' : em ? ' em' : '');
    s.textContent = w; s._key = key; s._em = em; s._t = T.verse + i * WORD_GAP;
    rows[li].appendChild(s);
    if (words[i + 1] && words[i + 1].li === li) rows[li].appendChild(document.createTextNode(' '));
    wordEls.push(s);
  });
  ctaEl = line('cta', V.cta, H * .655);
}
function fade(el, o, y = 0, blur = 0) {
  el.style.opacity = o; el.style.transform = `translateY(${y}px)`;
  el.style.filter = blur > .3 ? `blur(${blur}px)` : '';
}
function updateText(t) {
  const out = 1 - P(t, T.out, .6, E.inOutSine);
  const hIn = P(t, T.hookIn, .6), hOut = P(t, T.hookOut, .45, E.inOutSine);
  fade(hookEl, hIn * (1 - hOut), (1 - hIn) * 20 - hOut * 14, (1 - hIn) * 10 + hOut * 8);
  const tg = P(t, T.tag, .7); fade(tagEl, tg * .7 * out, (1 - tg) * 12);
  const rf = P(t, T.ref, .7); fade(refEl, rf * out, (1 - rf) * 16, (1 - rf) * 6);
  for (const s of wordEls) {
    const p = P(t, s._t, WORD_IN);
    fade(s, p * out, (1 - p) * 22, (1 - p) * 9);
    if (s._key) {
      const g = P(t, s._t + .35, 1.2, E.inOutSine);
      s.style.color = mix('#FFF8EC', '#FFC966', g);
      s.style.textShadow = `0 0 ${lerp(0, 38, g)}px rgba(255,190,90,${.75 * g}), 0 2px 28px rgba(40,14,4,.6)`;
    } else if (s._em) s.style.color = mix('#FFF8EC', '#FFE3AE', P(t, s._t + .3, 1));
  }
  const c = P(t, T.cta, .8); fade(ctaEl, c * .85 * out, (1 - c) * 16);
}

// ---------- golden-hour scene ----------
const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
const R = rng(9);
const HORIZON = H * .80;
const stalks = [];
// three depth layers: far (short, hazy, at the horizon) -> near (tall, dark, thick)
const LAYERS = [
  { n: 260, base: HORIZON + 30, h: [50, 90], lw: [1, 1.6], wheat: .35 },
  { n: 220, base: HORIZON + 160, h: [140, 200], lw: [1.6, 2.6], wheat: .45 },
  { n: 150, base: H + 30, h: [360, 340], lw: [2.6, 3.4], wheat: .55 },
];
LAYERS.forEach((L, layer) => {
  for (let i = 0; i < L.n; i++) stalks.push({
    layer, base: L.base, x: R() * (W + 80) - 40, h: L.h[0] + R() * L.h[1],
    lean: (R() - .5) * .3, ph: R() * TAU, amp: .03 + R() * .05,
    wheat: R() < L.wheat, lw: L.lw[0] + R() * L.lw[1], sc: .6 + layer * .35,
  });
});
stalks.sort((a, b) => a.layer - b.layer);
const motes = Array.from({ length: 70 }, () => ({ x: R() * W, y: H * .15 + R() * H * .7, r: .8 + R() * 2.6, ph: R() * TAU, ph2: R() * TAU, ax: 20 + R() * 50, ay: 30 + R() * 80, k: 1 + Math.floor(R() * 2) }));
const rays = Array.from({ length: 9 }, (_, i) => ({ a: -Math.PI / 2 + (i - 4) * .26 + (R() - .5) * .1, w: .04 + R() * .07, al: .05 + R() * .06, ph: R() * TAU }));

function drawScene(t) {
  const w = warmth(t);
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, mix('#1E2547', '#3A2E63', w));
  sky.addColorStop(.45, mix('#5B5A86', '#B8607A', w));
  sky.addColorStop(.78, mix('#C98E7C', '#F09A5B', w));
  sky.addColorStop(1, mix('#F2C49A', '#FFD98F', w));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // haze bands
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const y = H * (.38 + i * .1) + cyc(t, 1, i * 1.7) * 18;
    const g = ctx.createLinearGradient(0, y - 60, 0, y + 60);
    g.addColorStop(0, 'rgba(255,170,120,0)'); g.addColorStop(.5, `rgba(255,170,120,${.015 + .015 * w})`); g.addColorStop(1, 'rgba(255,170,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0, y - 60, W, 120);
  }

  // sun + glow
  const sx = W * .5 + cyc(t, 1) * 12, sy = HORIZON - lerp(20, 95, w);
  let g = ctx.createRadialGradient(sx, sy, 0, sx, sy, lerp(520, 900, w));
  g.addColorStop(0, `rgba(255,230,170,${.55 + .35 * w})`);
  g.addColorStop(.25, `rgba(255,170,90,${.22 + .2 * w})`);
  g.addColorStop(1, 'rgba(255,120,60,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 70);
  g.addColorStop(0, 'rgba(255,252,235,1)'); g.addColorStop(.6, 'rgba(255,236,190,.9)'); g.addColorStop(1, 'rgba(255,220,160,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, 70, 0, TAU); ctx.fill();

  // light rays
  for (const r of rays) {
    const a = r.a + cyc(t, 1, r.ph) * .05, len = 1700;
    const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, len);
    rg.addColorStop(0, `rgba(255,220,160,${r.al * .45 * (.4 + w)})`); rg.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(a - r.w) * len, sy + Math.sin(a - r.w) * len);
    ctx.lineTo(sx + Math.cos(a + r.w) * len, sy + Math.sin(a + r.w) * len);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // distant ground
  g = ctx.createLinearGradient(0, HORIZON - 10, 0, H);
  g.addColorStop(0, mix('#6E4A4E', '#9A5A3E', w)); g.addColorStop(.12, mix('#3A2420', '#4E2A1C', w)); g.addColorStop(.5, '#1A0D09'); g.addColorStop(1, '#080403');
  ctx.fillStyle = g; ctx.fillRect(0, HORIZON - 4, W, H);

  // wheat / grass silhouettes swaying in a wind wave that crosses the frame
  for (const s of stalks) {
    const sway = s.lean + s.amp * cyc(t, 2, s.ph * .3 + s.x * .006) + .03 * cyc(t, 3, s.ph);
    const baseY = s.base, tipX = s.x + Math.sin(sway) * s.h, tipY = baseY - Math.cos(sway) * s.h;
    ctx.strokeStyle = s.layer === 2 ? '#0D0604' : s.layer === 1 ? mix('#2A1610', '#3A1E12', w) : mix('#5A3A3A', '#8A5236', w);
    ctx.lineWidth = s.lw; ctx.beginPath(); ctx.moveTo(s.x, baseY);
    ctx.quadraticCurveTo(s.x + Math.sin(sway) * s.h * .2, baseY - s.h * .55, tipX, tipY); ctx.stroke();
    if (s.wheat) {
      ctx.save(); ctx.translate(tipX, tipY); ctx.rotate(sway * 1.3); ctx.scale(s.sc, s.sc);
      ctx.fillStyle = ctx.strokeStyle;
      for (let k = 0; k < 7; k++) {
        const yy = -k * 9;
        ctx.beginPath(); ctx.ellipse(-4, yy, 3.2, 7, -.5, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(4, yy - 4, 3.2, 7, .5, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }

  // drifting pollen catching the light
  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    const x = m.x + cyc(t, m.k, m.ph) * m.ax, y = m.y + cyc(t, 1, m.ph2) * m.ay;
    const near = clamp(1 - Math.hypot(x - sx, y - sy) / 1100);
    const a = (.15 + .55 * near) * (.6 + .4 * cyc(t, 4, m.ph)) * (.5 + .5 * w);
    ctx.fillStyle = `rgba(255,220,150,${a})`; ctx.beginPath(); ctx.arc(x, y, m.r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  cv.style.transform = `scale(${1 + .05 * Math.pow(Math.sin(Math.PI * t / DURATION), 2)})`;
}

const grain = document.getElementById('grain');
function seek(t) {
  drawScene(t);
  updateText(t);
  const fr = Math.floor(t * 24);
  grain.style.transform = `translate(${(fr * 37 % 100) - 50}px,${(fr * 61 % 100) - 50}px)`;
}

// ---------- boot ----------
Promise.all([document.fonts.load("600 88px Cormorant"), document.fonts.load("italic 500 76px Cormorant"), document.fonts.load("600 34px Inter")])
  .then(() => document.fonts.ready).then(() => {
  buildText(); seek(0);
  window.__seek = seek;
  window.__meta = { duration: DURATION, id: V.id };
  window.__ready = true;
  if (RENDER) return;
  const stage = document.getElementById('stage'), prog = document.querySelector('#ui > div');
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / W, (innerHeight - 10) / H)})`; };
  addEventListener('resize', fit); fit();
  let playing = true, cur = 0, last = performance.now();
  const loop = now => {
    if (playing) cur = (cur + (now - last) / 1000) % DURATION;
    last = now; seek(cur); prog.style.width = (cur / DURATION * 100) + '%';
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  stage.addEventListener('click', () => playing = !playing);
  addEventListener('keydown', e => { if (e.code === 'Space') { playing = !playing; e.preventDefault(); } });
  document.getElementById('ui').addEventListener('click', e => { cur = e.clientX / innerWidth * DURATION; });
});
</script>
</body>
</html>
